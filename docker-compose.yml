# ============================================
# SevaSaathi — Docker Compose for VPS Deployment
# ============================================
# Usage:
#   1. Copy .env.production.example to .env and fill values
#   2. docker compose up -d --build
#   3. docker compose exec app sh -c 'cd /app && bun run db:push -- --accept-data-loss'
#   4. docker compose exec app sh -c 'cd /app && bun run seed'
#   5. Visit http://your-server-ip:8080
#
# For custom domain + HTTPS, use Caddy/Nginx reverse proxy
# ============================================

services:
  mongo:
    image: mongo:7
    container_name: sevasaathi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sevasaathi-mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=sevasaathi

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sevasaathi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    volumes:
      # Persistent uploads
      - sevasaathi-uploads:/app/public/upload
    environment:
      # Connect to the MongoDB container
      - DATABASE_URL=mongodb://mongo:27017/sevasaathi
      - PORT=8080
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sevasaathi-mongo-data:
    driver: local
  sevasaathi-uploads:
    driver: local
