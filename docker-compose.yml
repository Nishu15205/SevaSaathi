# ============================================
# SevaSaathi — Docker Compose for VPS Deployment
# ============================================
# Usage:
#   1. Copy .env.production.example to .env and fill values
#   2. docker compose up -d --build
#   3. docker compose exec app sh -c 'cd /app && bun run db:push -- --accept-data-loss'
#   4. docker compose exec app sh -c 'cd /app && bun run seed'
#   5. Visit http://your-server-ip:8080
#
# For custom domain + HTTPS, use Caddy/Nginx reverse proxy
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sevasaathi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.production
    volumes:
      # Persistent SQLite database (only used with local file: DB)
      - sevasaathi-data:/app/data
      # Persistent uploads (only used with local file: DB)
      - sevasaathi-uploads:/app/public/upload
    environment:
      # Use local SQLite with volume for VPS deployment
      - DATABASE_URL=file:/app/data/sevasaathi.db
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sevasaathi-data:
    driver: local
  sevasaathi-uploads:
    driver: local
