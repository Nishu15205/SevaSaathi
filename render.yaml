# ============================================
# SevaSaathi — Render.com Blueprint
# This creates the web service with MongoDB (external)
# ============================================
# For MongoDB, use MongoDB Atlas (free tier) or any external MongoDB provider.
# Set DATABASE_URL in the Render dashboard or below.
# ============================================

services:
  - type: web
    name: sevasaathi-byon
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        # Set this to your MongoDB connection string, e.g.:
        # mongodb+srv://user:password@cluster0.xxxxx.mongodb.net/sevasaathi?retryWrites=true&w=majority
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://sevasaathi-byon.onrender.com
      - key: NODE_ENV
        value: production
      # Uncomment and fill in these as needed:
      # - key: GOOGLE_CLIENT_ID
      #   value: your-google-client-id
      # - key: GOOGLE_CLIENT_SECRET
      #   value: your-google-client-secret
      # - key: RAZORPAY_KEY_ID
      #   value: your-razorpay-key-id
      # - key: RAZORPAY_KEY_SECRET
      #   value: your-razorpay-key-secret
      # - key: BREVO_API_KEY
      #   value: your-brevo-api-key
      # - key: BREVO_SENDER_EMAIL
      #   value: your-verified-sender@email.com
      # - key: FIREBASE_API_KEY
      #   value: your-firebase-api-key
      # - key: FIREBASE_AUTH_DOMAIN
      #   value: your-project.firebaseapp.com
      # - key: FIREBASE_PROJECT_ID
      #   value: your-project-id
      # - key: FIREBASE_CLIENT_EMAIL
      #   value: firebase-adminsdk@your-project.iam.gserviceaccount.com
      # - key: FIREBASE_PRIVATE_KEY
      #   value: your-firebase-private-key
