name: sevasaathi
services:
  - name: sevasaathi-app
    instance_type: nano
    docker:
      dockerfile: Dockerfile
      build_context: .
    ports:
      - port: 8080
        protocol: http
    env:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: "production"
    # Dashboard > Environment > Add these:
    #   DATABASE_URL          → libsql://sevasaathi-abc.turso.io
    #   DATABASE_AUTH_TOKEN   → (turso token)
    #   NEXTAUTH_SECRET       → (random string)
    #   NEXTAUTH_URL          → https://your-app.koyeb.app
    #   FAST2SMS_API_KEY      → (your key)
    routes:
      - path: /