name: sevasaathi
services:
  - name: sevasaathi-app
    instance_type: nano
    docker:
      dockerfile: Dockerfile
      build_context: .
    ports:
      - port: 8080
        protocol: http
    env:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        value: "file:/app/data/sevasaathi.db"
    # Set these secrets in Koyeb dashboard:
    #   NEXTAUTH_SECRET   → openssl rand -base64 32
    #   NEXTAUTH_URL      → https://your-app.koyeb.app
    #   FAST2SMS_API_KEY  → your key
    routes:
      - path: /
